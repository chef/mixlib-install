---
"on":
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (${{ matrix.runner }}, ${{ matrix.ruby }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # Keep the EOL Rubies: the gemspec supports >= 2.6 and many Chef
        # environments still embed them.
        ruby:
          - 2.6
          - 2.7
          - "3.0"
          - 3.1
          - 3.2
          - 3.3
          - 3.4
          - "4.0"
        include:
          # aarch64 Linux, oldest and newest supported Ruby
          - runner: ubuntu-24.04-arm
            ruby: 2.6
          - runner: ubuntu-24.04-arm
            ruby: "4.0"
    steps:
      - &longpaths
        name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force -ErrorAction SilentlyContinue
          git config --global core.longpaths true
      - &checkout
        name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit tests
        run: bundle exec rake unit
      - name: Functional tests
        run: bundle exec rake functional

  # Early warning for breakage in the next Ruby release. Not a gate: it is
  # excluded from allchecks, so a failure here does not block merging.
  ruby-head:
    name: Ruby head canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - *checkout
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: head
          bundler-cache: true
      - name: Unit and functional tests
        run: bundle exec rake

  gem-package:
    name: Gem package (${{ matrix.runner }}, ${{ matrix.ruby }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
        ruby:
          - 2.6
          - "4.0"
    steps:
      - *longpaths
      - *checkout
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # The RubyGems 3.0 bundled with Ruby 2.6 does not skip dependency
          # versions whose required_ruby_version excludes the running Ruby,
          # so it picks the newest mixlib-shellout (Ruby >= 3.1) and fails. "latest"
          # means the newest RubyGems that still supports this Ruby.
          rubygems: latest
      - name: Build gem
        shell: bash
        run: |
          mkdir -p pkg
          gem build mixlib-install.gemspec --output pkg/mixlib-install.gem
          echo "EXPECTED_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Install gem
        shell: bash
        run: gem install --no-document pkg/mixlib-install.gem
      # Run from outside the checkout and without Bundler, so only the files
      # listed in spec.files and the declared runtime dependencies are visible.
      # This catches files missing from the gemspec and undeclared deps.
      - name: Smoke test installed gem
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Windows Ruby writes CRLF to pipes
          actual="$(mixlib-install version | tr -d '\r')"
          echo "expected=${EXPECTED_VERSION} actual=${actual}"
          test "$EXPECTED_VERSION" = "$actual"
          mixlib-install list-products | tr -d '\r' | grep -qx chef
          mixlib-install install-script -t sh -o install.sh
          mixlib-install install-script -t ps1 -o install.ps1
          grep -q "mixlib-install/${EXPECTED_VERSION}" install.sh
          ruby -e 'require "mixlib/install"; abort "empty install.sh" if Mixlib::Install.install_sh.empty?'
